# Use with the main file to run the stack against the pricing mock (the proposed contract) instead of the published image:
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml up --build
# Needed until the pricing service delivers the proposed contract (task 19).
services:
  pricing:
    image: !reset null
    build: backend
    command: ["uvicorn", "--factory", "tests.pricing_mock.app:create_mock_app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./backend/tests:/app/tests:ro
    healthcheck:
      disable: true
